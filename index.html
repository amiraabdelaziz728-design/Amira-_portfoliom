<!DOCTYPE html>  <html lang="ar" dir="rtl">  <head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>نظام إدارة وتحليل نتائج الطلاب</title>  <style>  
    body {  
        font-family: Arial;  
        background: #eaf4ff;  
        text-align: center;  
        padding: 15px;  
    }  

    .container {  
        background: white;  
        padding: 20px;  
        border-radius: 12px;  
        max-width: 650px;  
        margin: auto;  
    }  

    h2, h3 {  
        color: #174a7e;  
    }  

    table {  
        width: 100%;  
        border-collapse: collapse;  
        margin-top: 15px;  
    }  

    th, td {  
        border: 1px solid #b5cce5;  
        padding: 10px;  
    }  

    th {  
        background: #174a7e;  
        color: white;  
    }  

    td {  
        background: #f4f9ff;  
    }  
</style>

</head>  <body>  <div class="container">  <h2>نظام إدارة وتحليل نتائج الطلاب</h2>  

<h3>تقرير الطلاب</h3>  

<table>  
    <thead>  
        <tr>  
            <th>الاسم</th>  
            <th>المتوسط</th>  
            <th>التقدير</th>  
            <th>النتيجة</th>  
        </tr>  
    </thead>  
    <tbody id="studentsTable"></tbody>  
</table>  

<h3>لجنة الرأفة</h3>  

<table>  
    <thead>  
        <tr>  
            <th>الاسم</th>  
            <th>قبل الرأفة</th>  
            <th>بعد الرأفة</th>  
        </tr>  
    </thead>  
    <tbody id="mercyTable"></tbody>  
</table>  

<h3 id="mercyAverage"></h3>

</div>  <script>  
  
// 1- إنشاء Class الطالب  
class Student {  
  
    constructor(id, name, grades, attendance) {  
        this.id = id;  
        this.name = name;  
        this.grades = grades;  
        this.attendance = attendance;  
    }  
  
    // 2- حساب المتوسط باستخدام reduce  
    calculateAverage() {  
        let total = this.grades.reduce((sum, grade) => sum + grade, 0);  
        return total / this.grades.length;  
    }  
  
    // 3- تحديد التقدير  
    getGrade(average) {  
  
        if (average >= 90) {  
            return "A";  
        } else if (average >= 80) {  
            return "B";  
        } else if (average >= 70) {  
            return "C";  
        } else if (average >= 60) {  
            return "D";  
        } else if (average >= 50) {  
            return "E";  
        } else {  
            return "F";  
        }  
    }  
  
    // 4- تحديد النتيجة  
    getResult(average) {  
  
        if (average >= 50 && this.attendance >= 75) {  
            return "ناجح";  
        } else {  
            return "يحتاج مراجعة";  
        }  
    }  
}  
  
// 5- إنشاء مصفوفة الطلاب  
const studentsList = [  
  
    new Student(1, "Ahmed", [90, 85, 95], 90),  
  
    new Student(2, "Amira", [45, 42, 48], 80),  
  
    new Student(3, "Mona", [70, 75, 65], 85),  
  
    new Student(4, "Ali", [40, 45, 42], 70)  
  
];  
  
// 6- طباعة تقرير الطلاب  
console.log("===== Students Report =====");  
  
studentsList.forEach(student => {  
  
    let average = student.calculateAverage();  
  
    console.log("Name:", student.name);  
    console.log("Average:", average.toFixed(2));  
    console.log("Grade:", student.getGrade(average));  
    console.log("Result:", student.getResult(average));  
  
    console.log("--------------------");  
  
    document.getElementById("studentsTable").innerHTML += `  
        <tr>  
            <td>${student.name}</td>  
            <td>${average.toFixed(2)}</td>  
            <td>${student.getGrade(average)}</td>  
            <td>${student.getResult(average)}</td>  
        </tr>  
    `;  
});  
  
// 7- استخراج الطلاب المتعثرين باستخدام filter  
const strugglingStudents = studentsList.filter(student => {  
  
    let average = student.calculateAverage();  
  
    return average >= 40 && average <= 49;  
  
});  
  
// 8- إضافة 5 درجات رأفة باستخدام map  
const mercyStudents = strugglingStudents.map(student => {  
  
    let oldAverage = student.calculateAverage();  
  
    let newAverage = Math.min(oldAverage + 5, 50);  
  
    return {  
        id: student.id,  
        name: student.name,  
        oldAverage: oldAverage,  
        newAverage: newAverage  
    };  
});  
  
// 9- جمع المتوسطات الجديدة باستخدام reduce  
const totalMercy = mercyStudents.reduce((sum, student) => {  
  
    return sum + student.newAverage;  
  
}, 0);  
  
// 10- حساب متوسط الرأفة مع الحماية من القسمة على صفر  
const mercyAverage = mercyStudents.length > 0  
    ? totalMercy / mercyStudents.length  
    : 0;  
  
// 11- طباعة تقرير لجنة الرأفة  
console.log("===== Mercy Committee =====");  
  
console.log("Struggling Students:", mercyStudents);  
  
mercyStudents.forEach(student => {  
  
    document.getElementById("mercyTable").innerHTML += `  
        <tr>  
            <td>${student.name}</td>  
            <td>${student.oldAverage.toFixed(2)}</td>  
            <td>${student.newAverage.toFixed(2)}</td>  
        </tr>  
    `;  
});  
  
// 12- عرض متوسط الرأفة  
document.getElementById("mercyAverage").innerHTML =  
    "متوسط الطلاب بعد الرأفة: " + mercyAverage.toFixed(2);  
  
console.log("Average After Mercy:", mercyAverage);  
  
</script>  </body>  
</html>
